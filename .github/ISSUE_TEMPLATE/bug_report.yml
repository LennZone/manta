name: Bug report
description: Something in Manta doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search the existing issues and the
        [manual's troubleshooting chapter](https://manta-filemanager.com/manual/en/fehlerbehebung.html) first.

        **Security vulnerabilities** must not be reported here; see [SECURITY.md](https://github.com/web-workers-com/manta/blob/HEAD/SECURITY.md).

        Tip: **Help → Report an Issue…** in Manta opens this form with the Manta version, the macOS version
        and the chip already filled in.
  - type: input
    id: manta-version
    attributes:
      label: Manta version
      description: Manta → About Manta (filled in when you use Help → Report an Issue…)
      placeholder: e.g. 0.3.3
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac (filled in when you use Help → Report an Issue…)
      placeholder: e.g. macOS 15.6
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model and chip
      description: Manta fills in the chip (Apple silicon or Intel); please add the model.
      placeholder: e.g. MacBook Air (M2), Apple silicon (arm64)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Local files
        - SFTP
        - FTP / FTPS
        - S3
        - Docker / Kubernetes
        - Cloud folders (iCloud Drive, Google Drive, …)
        - Archives
        - Terminal
        - A built-in plugin
        - An external plugin
        - Updates
        - Other
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        The relevant lines from the log file `~/Library/Logs/Manta/manta.log`
        (Help → Show Log File in Finder, or the command palette → "Show Log File in Finder").
        For more detail, start Manta from the Terminal with
        `MANTA_LOG=debug /Applications/Manta.app/Contents/MacOS/manta`.
        **The log may contain private data** such as file paths, user names, server and host names:
        please remove or replace them before you paste it here.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help, e.g. the app language, plugins you use, or whether it worked in an earlier version.

[package]
name = "manta-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
manta-core.workspace = true
chrono.workspace = true
log.workspace = true
dirs = "6"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
# FTPS: suppaftp's TLS hook ("secure") with our own rustls connector (ftp/tls.rs):
# TLS session reuse on data connections and the clear-data fallback.
suppaftp = { version = "12", features = ["secure"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Certificates are checked by macOS (Keychain trust settings, like Safari).
rustls-platform-verifier = "0.7"
tempfile = "3"
zip.workspace = true
tar.workspace = true
flate2.workspace = true
bzip2.workspace = true
lzma-rust2.workspace = true
zstd.workspace = true
# S3 backend: small synchronous SigV4 client (no tokio / AWS SDK).
# WebDAV backend too; "platform-verifier": WebDAV checks certificates with
# macOS (Keychain trust settings), like FTPS.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
hmac = "0.13"
sha2 = "0.11"
md-5 = "0.10"
base64 = "0.22"
quick-xml = "0.41"
# Google Drive backend (Drive API v3 JSON, OAuth 2.0 PKCE verifier/state).
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"
# Mounted volumes (getmntinfo) for SMB connections and network volumes.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# getattrlistbulk(2) for listing very large local folders (local.rs).
libc = "0.2"
# Google Drive refresh tokens live in the login Keychain.
security-framework = "3"
# Cloud folders: iCloud / File Provider download status, download / evict.
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSError", "NSFileManager", "NSObject", "NSMetadata", "NSMetadataAttributes"] }

[dev-dependencies]
tempfile = "3"
manta-ops.workspace = true

[[bin]]
name = "manta-gdrive-selftest"
path = "src/bin/gdrive_selftest.rs"

[package]
name = "manta-plugin"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
manta-core.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
toml.workspace = true
dirs.workspace = true
base64 = "0.22"
# Installing plugins from .zip / .mantaplugin archives (install.rs).
zip.workspace = true
# macOS quarantine attribute (install.rs).
libc = "0.2"
# The community directory (registry.rs): same HTTP stack and hash as the updater.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
# The standalone SDK crate for third-party Rust plugins: checked against
# the host's types in tests/sdk_compat.rs.
manta-plugin-protocol.workspace = true

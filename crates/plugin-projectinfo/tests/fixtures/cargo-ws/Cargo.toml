# A Cargo workspace (fixture).
[workspace]
resolver = "2"
members = [
    "crates/*",  # every crate
]
exclude = ["crates/old"]

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1.0"

[profile.release]
lto = true

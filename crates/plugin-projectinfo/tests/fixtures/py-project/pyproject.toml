[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acme-tools"
version = "0.9.1"
description = 'Tools for the "Acme" team'
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "rich",
]

[project.scripts]
acme-sync = "acme_tools.sync:main"
acme-report = "acme_tools.report:main"

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
cov = ["coverage run -m pytest", "coverage report"]

[tool.hatch.envs.docs]
dependencies = ["mkdocs"]
[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve"

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]  # rules

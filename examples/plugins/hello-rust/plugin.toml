# plugin.toml: tells Manta what your plugin is and how to start it.
# Copy this folder, change `id`, `name` and `repository`, then edit src/main.rs.
# Reference: docs/plugins.md

# Unique id: lowercase letters, digits, '.', '-', '_' (manta.* is reserved).
id = "hello-rust"
name = "Hello Rust"
version = "0.1.0"
description = "Template plugin in Rust, using the manta-plugin-protocol crate: a palette command, a context-menu command and an item-count chip."
author = "Manta"

# Source, license and the oldest Manta that can run it (shown when installing).
license = "MIT"
repository = "https://github.com/web-workers-com/manta/tree/main/examples/plugins/hello-rust"
min_manta_version = "0.3.0"

# What the plugin does, shown in the install/trust dialog. Declarative
# only (Manta doesn't enforce it), so be honest. Vocabulary: read_files,
# write_files, network, run_programs, terminal.
# This one lists local folders to count their items.
permissions = ["read_files"]

# The protocol version this plugin speaks.
api_version = 1

# Started with the plugin folder as working directory. Run
# `cargo build --release` first. To distribute the plugin, ship the
# compiled binary (e.g. bin/hello-rust) and point `command` at it:
#   command = ["./bin/hello-rust"]
command = ["./target/release/hello-rust"]

# Informational: shown in Settings › Plugins.
capabilities = ["chips", "commands"]

# Name and description in Manta's other languages.
[localized.de]
name = "Hallo Rust"
description = "Vorlage in Rust mit dem Crate manta-plugin-protocol: ein Befehl in der Befehlspalette, einer im Kontextmenü und ein Chip mit der Anzahl der Objekte."

[localized.zh]
name = "你好 Rust"
description = "Rust 插件模板（使用 manta-plugin-protocol）：一个命令面板命令、一个右键菜单命令和一个显示项目数量的标签。"

[localized.es]
name = "Hola Rust"
description = "Plantilla de plugin en Rust con el crate manta-plugin-protocol: un comando en la paleta, uno en el menú contextual y una etiqueta con el número de ítems."

[localized.fr]
name = "Bonjour Rust"
description = "Modèle de plug-in en Rust avec la crate manta-plugin-protocol : une commande dans la palette, une dans le menu contextuel et une pastille avec le nombre d’éléments."

[localized.it]
name = "Ciao Rust"
description = "Modello di plug-in in Rust con il crate manta-plugin-protocol: un comando nella palette, uno nel menu contestuale e un’etichetta con il numero di elementi."

[localized.ru]
name = "Привет, Rust"
description = "Шаблон плагина на Rust с крейтом manta-plugin-protocol: команда в палитре, команда в контекстном меню и метка с числом объектов."

# Commands are registered at runtime (src/main.rs sends `register_commands`
# with titles in the current language), so none are declared here.
